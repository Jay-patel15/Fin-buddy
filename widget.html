<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFD400" />
  <title>FINBUDDY · WIDGET</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* Widget-specific overrides — minimal, dense */
    body { padding: 0; }
    .widget {
      max-width: 360px;
      margin: 12px auto;
      padding: 12px;
    }
    .w-card {
      background: var(--paper);
      border: 4px solid var(--black);
      box-shadow: var(--shadow-lg);
      padding: 14px;
      margin-bottom: 10px;
    }
    .w-bal {
      background: var(--green);
      border: 4px solid var(--black);
      box-shadow: var(--shadow-lg);
      padding: 16px;
      margin-bottom: 10px;
    }
    .w-bal .lab { font-family: var(--display); font-size: 11px; letter-spacing: 3px; }
    .w-bal .num { font-family: var(--display); font-size: 28px; font-weight: 900; margin-top: 4px; }
    .w-mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .w-mini {
      background: var(--paper);
      border: 3px solid var(--black);
      padding: 10px;
      box-shadow: var(--shadow-sm);
    }
    .w-mini.in  { background: var(--green); }
    .w-mini.out { background: var(--pink); color: var(--paper); }
    .w-mini .l { font-family: var(--display); font-size: 10px; letter-spacing: 2px; }
    .w-mini .v { font-family: var(--display); font-size: 16px; font-weight: 900; }
    .w-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .w-actions a {
      display: block;
      text-align: center;
      padding: 12px 8px;
      font-family: var(--display);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--black);
      text-decoration: none;
      border: 3px solid var(--black);
      box-shadow: var(--shadow);
      background: var(--yellow);
      text-transform: uppercase;
    }
    .w-actions a.b { background: var(--blue); color: var(--paper); }
    .w-actions a:active { transform: translate(2px, 2px); box-shadow: var(--shadow-sm); }
    .w-locked {
      background: var(--paper);
      border: 4px solid var(--black);
      box-shadow: var(--shadow-lg);
      padding: 20px;
      text-align: center;
    }
    .w-locked h2 {
      font-family: var(--display);
      letter-spacing: 2px;
      margin: 0 0 8px;
      text-transform: uppercase;
    }
    .w-locked a {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 20px;
      background: var(--black);
      color: var(--yellow);
      font-family: var(--display);
      letter-spacing: 2px;
      text-decoration: none;
      border: 3px solid var(--black);
      box-shadow: var(--shadow);
    }
    .w-tx {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 2px dashed var(--black);
      font-size: 12px;
    }
    .w-tx:last-child { border-bottom: none; }
    .w-tx .t1 { flex: 1; min-width: 0; font-weight: 700; }
    .w-tx .t2 { font-weight: 900; font-family: var(--mono); }
    .w-tx .t2.in  { color: var(--green-d); }
    .w-tx .t2.out { color: var(--red); }
    .w-foot {
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--ash);
      margin-top: 8px;
      font-weight: 700;
    }
    .brand-bar {
      background: var(--black);
      color: var(--yellow);
      padding: 8px 12px;
      font-family: var(--display);
      letter-spacing: 3px;
      font-size: 12px;
      text-align: center;
      border: 3px solid var(--black);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="brand-bar">FINBUDDY · WIDGET</div>
    <div id="widget-root"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script>
  (async function () {
    const root = document.getElementById('widget-root');
    const { el, fmtMoney, fmtDate, sumMoney, startOfMonth, endOfMonth } = Utils;

    // If the user hasn't set up the app yet, show a setup prompt.
    const user = await DB.getMeta('user');
    if (!user) {
      root.innerHTML = '';
      root.appendChild(el('div', { class: 'w-locked' }, [
        el('h2', {}, 'NO VAULT'),
        el('div', { class: 'muted', style: 'font-size:12px;' }, 'Set up FinBuddy first.'),
        el('a', { href: 'index.html' }, 'OPEN APP')
      ]));
      return;
    }

    const accounts = await DB.all('accounts');
    const txs = await DB.all('transactions');

    const net = sumMoney(accounts, a => a.balance || 0);

    const monthFrom = startOfMonth();
    const monthTo   = endOfMonth();
    const inSum  = sumMoney(txs.filter(t => t.type === 'income'  && t.ts >= monthFrom && t.ts <= monthTo));
    const outSum = sumMoney(txs.filter(t => t.type === 'expense' && t.ts >= monthFrom && t.ts <= monthTo));

    const recent = txs.slice().sort((a,b) => b.ts - a.ts).slice(0, 4);
    const accMap = Object.fromEntries(accounts.map(a => [a.id, a.name]));

    root.innerHTML = '';
    root.appendChild(el('div', { class: 'w-bal' }, [
      el('div', { class: 'lab' }, '// NET BALANCE'),
      el('div', { class: 'num' }, fmtMoney(net))
    ]));
    root.appendChild(el('div', { class: 'w-mini-grid' }, [
      el('div', { class: 'w-mini in' }, [
        el('div', { class: 'l' }, 'IN — MONTH'),
        el('div', { class: 'v' }, fmtMoney(inSum))
      ]),
      el('div', { class: 'w-mini out' }, [
        el('div', { class: 'l' }, 'OUT — MONTH'),
        el('div', { class: 'v' }, fmtMoney(outSum))
      ])
    ]));

    // recent list
    if (recent.length) {
      const card = el('div', { class: 'w-card' }, [
        el('div', { class: 'view-title', style: 'margin-bottom:6px;' }, 'RECENT')
      ]);
      recent.forEach(t => {
        const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '-' : '↹';
        const cls  = t.type === 'income' ? 'in' : t.type === 'expense' ? 'out' : '';
        card.appendChild(el('div', { class: 'w-tx' }, [
          el('div', { class: 't1' }, [
            el('div', {}, (t.notes || accMap[t.accountId] || '—').slice(0, 22)),
            el('div', { class: 'muted', style: 'font-size:10px;letter-spacing:1px;' }, fmtDate(t.ts))
          ]),
          el('div', { class: 't2 ' + cls }, sign + fmtMoney(t.amount).replace('-',''))
        ]));
      });
      root.appendChild(card);
    }

    // Quick actions
    root.appendChild(el('div', { class: 'w-actions' }, [
      el('a', { href: 'index.html#add' }, '+ ADD'),
      el('a', { href: 'index.html#split', class: 'b' }, '⌥ SPLIT'),
      el('a', { href: 'index.html#monthly' }, '▤ MONTH'),
      el('a', { href: 'index.html' }, '◉ OPEN')
    ]));

    root.appendChild(el('div', { class: 'w-foot' }, '/ Embeddable widget · refreshes on open /'));
  })();
  </script>
</body>
</html>
