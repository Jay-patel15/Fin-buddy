<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#FFD400" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FINBUDDY</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- BOOT / LOCK SCREEN -->
  <section id="lock-screen" class="screen lock">
    <div class="boot">
      <div class="logo">
        <span class="glitch" data-text="FINBUDDY">FINBUDDY</span>
        <div class="tagline">// offline ledger v1.0</div>
      </div>

      <div id="lock-setup" class="hidden">
        <h2>&gt; FIRST RUN</h2>
        <p class="muted">Create your local vault. Nothing leaves this device.</p>
        <input id="setup-pin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="PIN (4-8 digits)" maxlength="8" />
        <input id="setup-pin-confirm" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="CONFIRM PIN" maxlength="8" />
        <button id="setup-submit" class="btn btn-primary">[ CREATE VAULT ]</button>
        <div id="setup-error" class="error"></div>
      </div>

      <div id="lock-login" class="hidden">
        <div class="pin-dots" id="pin-dots">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="keypad" id="keypad">
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
          <button id="kp-bio" data-k="bio" title="Biometric">⊙</button>
          <button data-k="0">0</button>
          <button data-k="del" title="delete">⌫</button>
        </div>
        <div id="login-error" class="error"></div>
      </div>
    </div>
  </section>

  <!-- MAIN APP -->
  <section id="app-screen" class="screen hidden">
    <header class="topbar">
      <div class="brand">FIN<span class="dot">·</span>BUDDY</div>
      <div class="topbar-actions">
        <span id="net-balance" class="net">₹0</span>
        <button id="settings-btn" class="icon-btn" title="settings">⚙</button>
        <button id="lock-btn" class="icon-btn" title="lock">⏻</button>
      </div>
    </header>

    <main id="view-root" class="view-root"></main>

    <nav class="tabbar">
      <button class="tab" data-route="dashboard"><span>◉</span><label>HOME</label></button>
      <button class="tab" data-route="transactions"><span>≡</span><label>LOG</label></button>
      <button class="tab fab-tab" data-route="add"><span class="fab">+</span></button>
      <button class="tab" data-route="split"><span>⌥</span><label>SPLIT</label></button>
      <button class="tab" data-route="analytics"><span>▤</span><label>STATS</label></button>
    </nav>
  </section>

  <!-- MODAL ROOT -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- ORDER MATTERS -->
  <script src="js/utils.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/db.js"></script>
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/share.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/export.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/transactions.js"></script>
  <script src="js/views/add.js"></script>
  <script src="js/views/split.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/accounts.js"></script>
  <script src="js/views/budgets.js"></script>
  <script src="js/views/categories.js"></script>
  <script src="js/views/monthly.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
