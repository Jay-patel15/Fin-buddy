name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install Dependencies & Capacitor
        run: |
          mkdir www
          rsync -av --exclude='www' --exclude='.git' --exclude='.github' ./ www/
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          npx cap init FinBuddy com.finbuddy.app --web-dir www
          npx cap add android
          npx cap sync
          
      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FinBuddy-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
