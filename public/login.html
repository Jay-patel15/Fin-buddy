<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFD400" />
  <title>FINBUDDY · LOGIN</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 48px; }
    .pw-eye {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--yellow);
      border: 3px solid var(--black);
      box-shadow: 2px 2px 0 #000;
      font-family: var(--display);
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--black);
      cursor: pointer;
    }
    .pw-eye:active { transform: translateY(-50%) translate(1px,1px); box-shadow: 1px 1px 0 #000; }
  </style>
</head>
<body>
  <section class="screen lock">
    <div class="boot">
      <div class="logo">
        <span class="glitch" data-text="FINBUDDY">FINBUDDY</span>
        <div class="tagline">// sign in to your ledger</div>
      </div>

      <form id="login-form" autocomplete="on" novalidate>
        <h2>&gt; LOGIN</h2>
        <input id="username" type="text" name="username" placeholder="USERNAME" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required />
        <div class="pw-wrap">
          <input id="password" type="password" name="password" placeholder="PASSWORD" autocomplete="current-password" required minlength="4" />
          <button type="button" class="pw-eye" id="pw-toggle" aria-label="Show password">SHOW</button>
        </div>
        <button id="submit" class="btn btn-primary" type="submit">[ SIGN IN ]</button>
        <div id="error" class="error"></div>
      </form>

      <div class="muted center" style="margin-top:14px;font-size:11px;letter-spacing:2px;">
        NO ACCOUNT?
        <a href="register.html" class="link" style="margin-left:6px;">[ CREATE ONE → ]</a>
      </div>
    </div>
  </section>

  <script>
  (async () => {
    try {
      const r = await fetch('/api/auth/me', { credentials: 'include' });
      if (r.ok) { location.href = '/'; return; }
    } catch (_) { /* show form */ }

    const form    = document.getElementById('login-form');
    const errEl   = document.getElementById('error');
    const submit  = document.getElementById('submit');
    const userIn  = document.getElementById('username');
    const passIn  = document.getElementById('password');
    const eyeBtn  = document.getElementById('pw-toggle');

    eyeBtn.addEventListener('click', () => {
      const showing = passIn.type === 'text';
      passIn.type = showing ? 'password' : 'text';
      eyeBtn.textContent = showing ? 'SHOW' : 'HIDE';
      eyeBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      submit.disabled = true;
      submit.textContent = '[ SIGNING IN... ]';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: userIn.value.trim().toLowerCase(), password: passIn.value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.error || 'login failed');
        location.href = '/';
      } catch (err) {
        errEl.textContent = '> ' + err.message;
        submit.disabled = false;
        submit.textContent = '[ SIGN IN ]';
      }
    });
  })();
  </script>
</body>
</html>
